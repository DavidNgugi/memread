name: Package macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: David Ngugi (YKY7LZN774)"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Run Rust linting
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: src-tauri
      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri
      - name: Verify frontend build
        run: npm run build
      - name: Verify Apple release credentials
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "${{ secrets.APPLE_API_KEY_BASE64 }}"
      - name: Restore App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build MemRead installer
        # Tauri imports the Developer ID certificate, notarizes, and staples the DMG.
        run: npm run tauri build
      - name: Verify signed and notarized installer
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Publish the macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
