name: Package macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: David Ngugi (H5VCJSQZFX)"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Run Rust linting
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: src-tauri
      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri
      - name: Verify frontend build
        run: npm run build
      - name: Verify Apple release credentials
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          test -n "${{ secrets.APPLE_API_KEY_BASE64 }}"
      - name: Restore App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed MemRead installer
        # Keep notarization separate so a transient Apple network failure can be retried safely.
        run: env -u APPLE_API_KEY -u APPLE_API_ISSUER -u APPLE_API_KEY_PATH npm run tauri build -- --bundles dmg
      - name: Notarize and staple installer
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"

          submission_json=""
          for attempt in 1 2 3; do
            if submission_json=$(xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json); then
              break
            fi
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 30))
          done

          submission_id=$(printf '%s' "$submission_json" | plutil -extract id raw -)
          test -n "$submission_id"
          for attempt in 1 2 3 4 5; do
            if xcrun notarytool wait "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER"; then
              break
            fi
            test "$attempt" = 5 && exit 1
            sleep 30
          done
          xcrun stapler staple "$dmg"
      - name: Verify signed and notarized installer
        run: |
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Publish the macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
